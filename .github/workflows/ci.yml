name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./...

      - name: build
        run: go build -trimpath -o /dev/null .
        if: runner.os != 'Windows'

      - name: build (windows)
        run: go build -trimpath -o NUL .
        if: runner.os == 'Windows'
